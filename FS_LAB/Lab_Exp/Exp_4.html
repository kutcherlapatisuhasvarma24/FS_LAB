<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS Core Concepts Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      line-height: 1.6;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    header h1 {
      color: var(--accent);
      font-size: 2.2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 15px;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    input[type="text"],
    input[type="email"],
    select,
    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      outline: none;
    }
    input[type="text"],
    input[type="email"],
    select {
      background: #0f172a;
      color: var(--text-color);
    }
    button {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--accent-hover);
      color: #fff;
    }
    /* Task List */
    ul {
      list-style: none;
      margin-top: 15px;
      max-height: 180px;
      overflow-y: auto;
    }
    li {
      background: #0f172a;
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      width: auto;
      padding: 4px 8px;
      margin-top: 0;
      font-size: 0.8rem;
    }
    .delete-btn:hover {
      background: #dc2626;
    }
    /* Form Submissions Output */
    .submission-card {
      background: #0f172a;
      border-left: 3px solid var(--accent);
      padding: 10px 12px;
      margin-top: 10px;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .submission-card strong {
      color: var(--accent);
    }
    .submission-card .timestamp {
      font-size: 0.75rem;
      color: #94a3b8;
      display: block;
      margin-top: 4px;
    }
    /* Sports & Interests Component */
    .checkbox-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
      background: #0f172a;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .checkbox-label input {
      accent-color: var(--accent);
      cursor: pointer;
    }
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }
    .tag-pill {
      background: #0f172a;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tag-pill button {
      background: none;
      border: none;
      color: #ef4444;
      width: auto;
      padding: 0;
      margin: 0;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
    }
  </style>
</head>
<body>
  <header>
    <h1>Student Form</h1>
    <p>OOP, Form Submissions, DOM State & Interests Selector</p>
  </header>
  <main class="grid">
    <!-- 1. Task Manager -->
    <section class="card">
      <h2>1. Task Manager (LocalStorage & OOP)</h2>
      <form id="task-form">
        <input type="text" id="task-input" placeholder="Enter new task..." required />
        <button type="submit">Add Task</button>
      </form>
      <ul id="task-list"></ul>
    </section>
    <!-- 2. Form Submission Module -->
    <section class="card">
      <h2>2. User Registration Form</h2>
      <form id="user-form">
        <input type="text" id="user-name" placeholder="Full Name" required />
        <input type="email" id="user-email" placeholder="Email Address" required />
        <select id="user-role" required>
          <option value="" disabled selected>Select Role...</option>
          <option value="Developer">Developer</option>
          <option value="Designer">Designer</option>
          <option value="Student">Student</option>
        </select>
        <button type="submit">Submit Details</button>
      </form>
      <div id="submissions-container" style="margin-top: 15px; max-height: 180px; overflow-y: auto;">
        <!-- Dynamic submissions render here -->
      </div>
    </section>
    <!-- 3. Sports & Interests Selection Module -->
    <section class="card">
      <h2>3. Sports & Interests Selector</h2>
      <form id="interests-form">
        <select id="category-select" required>
          <option value="" disabled selected>Primary Interest Category...</option>
          <option value="Outdoor Sports">Outdoor Sports</option>
          <option value="Indoor Games">Indoor Games</option>
          <option value="Fitness & Health">Fitness & Health</option>
        </select>
        <p style="font-size: 0.85rem; margin-top: 10px; color: #94a3b8;">Select your favorite sports:</p>
        <div class="checkbox-group">
          <label class="checkbox-label"><input type="checkbox" name="sport" value="Football"> Football</label>
          <label class="checkbox-label"><input type="checkbox" name="sport" value="Basketball"> Basketball</label>
          <label class="checkbox-label"><input type="checkbox" name="sport" value="Tennis"> Tennis</label>
          <label class="checkbox-label"><input type="checkbox" name="sport" value="Cricket"> Cricket</label>
          <label class="checkbox-label"><input type="checkbox" name="sport" value="Swimming"> Swimming</label>
          <label class="checkbox-label"><input type="checkbox" name="sport" value="Badminton"> Badminton</label>
        </div>
        <button type="submit">Save Preferences</button>
      </form>
      <div id="selected-tags" class="tags-container">
        <!-- Selected sport tags render here -->
      </div>
    </section>
  </main>
  <script>
    // ==========================================
    // Utility: XSS Protection
    // ==========================================
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g,
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
    // ==========================================
    // 1. OOP & LOCAL STORAGE (Task Manager)
    // ==========================================
    class TaskManager {
      constructor(storageKey) {
        this.storageKey = storageKey;
        this.tasks = JSON.parse(localStorage.getItem(this.storageKey)) || [];
      }
      addTask(title) {
        const task = { id: Date.now(), title };
        this.tasks.push(task);
        this.save();
        return task;
      }
      deleteTask(id) {
        this.tasks = this.tasks.filter(task => task.id !== id);
        this.save();
      }
      save() {
        localStorage.setItem(this.storageKey, JSON.stringify(this.tasks));
      }
    }
    const appTasks = new TaskManager('my_app_tasks');
    const taskForm = document.getElementById('task-form');
    const taskInput = document.getElementById('task-input');
    const taskList = document.getElementById('task-list');
    function renderTasks() {
      taskList.innerHTML = '';
      appTasks.tasks.forEach(task => appendTaskDOM(task));
    }
    function appendTaskDOM(task) {
      const li = document.createElement('li');
      li.dataset.id = task.id;
      li.innerHTML = `
        <span>${escapeHTML(task.title)}</span>
        <button class="delete-btn">Delete</button>
      `;
      taskList.appendChild(li);
    }
    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = taskInput.value.trim();
      if (title) {
        const newTask = appTasks.addTask(title);
        appendTaskDOM(newTask);
        taskInput.value = '';
      }
    });
    taskList.addEventListener('click', (e) => {
      if (e.target.classList.contains('delete-btn')) {
        const li = e.target.parentElement;
        const id = Number(li.dataset.id);
        appTasks.deleteTask(id);
        li.remove();
      }
    });
    // ==========================================
    // 2. USER REGISTRATION FORM
    // ==========================================
    const userForm = document.getElementById('user-form');
    const submissionsContainer = document.getElementById('submissions-container');
    userForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('user-name').value.trim();
      const email = document.getElementById('user-email').value.trim();
      const role = document.getElementById('user-role').value;
      const submission = {
        name,
        email,
        role,
        time: new Date().toLocaleTimeString()
      };
      renderSubmissionDetails(submission);
      userForm.reset();
    });
    function renderSubmissionDetails(data) {
      const card = document.createElement('div');
      card.className = 'submission-card';
      card.innerHTML = `
        <div><strong>Name:</strong> ${escapeHTML(data.name)}</div>
        <div><strong>Email:</strong> ${escapeHTML(data.email)}</div>
        <div><strong>Role:</strong> ${escapeHTML(data.role)}</div>
        <span class="timestamp">Submitted at ${data.time}</span>
      `;
      submissionsContainer.prepend(card);
    }
    // ==========================================
    // 3. SPORTS & INTERESTS SELECTOR
    // ==========================================
    const interestsForm = document.getElementById('interests-form');
    const selectedTagsContainer = document.getElementById('selected-tags');
    interestsForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const category = document.getElementById('category-select').value;
      const checkedBoxes = document.querySelectorAll('input[name="sport"]:checked');
      const selectedSports = Array.from(checkedBoxes).map(cb => cb.value);
      if (selectedSports.length === 0) {
        alert('Please select at least one sport!');
        return;
      }
      renderInterestTags(category, selectedSports);
    });
    function renderInterestTags(category, sports) {
      selectedTagsContainer.innerHTML = ''; // Clear previous tags
      // Render Category Badge
      const catBadge = document.createElement('div');
      catBadge.style.width = '100%';
      catBadge.style.fontSize = '0.85rem';
      catBadge.style.color = '#94a3b8';
      catBadge.innerHTML = `Category: <strong style="color:var(--accent);">${escapeHTML(category)}</strong>`;
      selectedTagsContainer.appendChild(catBadge);
      // Render Pill for each selected sport
      sports.forEach(sport => {
        const pill = document.createElement('div');
        pill.className = 'tag-pill';
        pill.innerHTML = `
          ${escapeHTML(sport)}
          <button type="button" class="remove-tag">&times;</button>
        `;
        selectedTagsContainer.appendChild(pill);
      });
    }
    // Remove individual pill on click
    selectedTagsContainer.addEventListener('click', (e) => {
      if (e.target.classList.contains('remove-tag')) {
        e.target.parentElement.remove();
      }
    });
    // Initialize state on load
    renderTasks();
  </script>
</body>
</html>
